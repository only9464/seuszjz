# 应用元信息。版本号请同时改这里和 build/windows/info.json 的
# fixed.file_version / fixed.product_version / info.0000.*Version（必须四段式, 如 1.0.0.0,
# 否则 Windows 会忽略 exe 的版本信息）。改用 CI 发版时, .github/scripts/set-version.py
# 会一次性改好这些文件 (config.yml / info.json / 前端 package.json / darwin+ios 的 Info.plist /
# linux 的 nfpm.yaml); 本地手动改完请跑 `wails3 task update:build-assets` 重新生成
# 各平台的 plist / gradle / nfpm 等构建资源。
version: '3'

info:
  companyName: "seuszjz"
  productName: "东南大学讲座助手"
  productIdentifier: "com.seuszjz.lecture"
  description: "东南大学素质讲座预约助手"
  copyright: "Copyright (c) 2026 seuszjz contributors, MIT License"
  comments: "东南大学素质讲座预约助手"
  version: "dev"

# iOS 工程生成 (wails3 ios xcode:gen / overlay:gen) 用的覆盖项;
# 不填的字段回落到上面的 info 段。version 故意不填, 跟着 info.version 走。
ios:
  bundleID: "com.seuszjz.lecture"
  displayName: "东南大学讲座助手"
  company: "seuszjz"
  comments: "东南大学素质讲座预约助手"
  minIOSVersion: "15.0"

# 开发模式: 改动 Go 文件后自动重编并重启; 前端由 Vite 热更新, 不在此监听。
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown
