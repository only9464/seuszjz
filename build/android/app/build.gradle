plugins {
    id 'com.android.application'
}

// 版本号与 build/config.yml 的 info.version 保持一致（build/android/app -> ../../config.yml），
// 发版时只改 config.yml 一处，APK/AAB 自动跟上。
def configFile = rootProject.file('../config.yml')
def appVersion = '1.1.1'
def appVersionCode = 10101
if (configFile.exists()) {
    def m = configFile.getText('UTF-8') =~ /(?m)^\s{2}version:\s*['"]?([0-9][^'"\s]*)/
    if (m.find()) {
        appVersion = m.group(1)
        def parts = appVersion.split('[-+]')[0].tokenize('.').take(3).collect { it.isInteger() ? it.toInteger() : 0 }
        while (parts.size() < 3) { parts << 0 }
        appVersionCode = parts[0] * 10000 + parts[1] * 100 + parts[2]
    }
}

android {
    // namespace 必须和 Java 包名 com.wails.app 一致（Wails 生成的活动都在这个包里），
    // 应用真正的包名由下面的 applicationId 决定。
    namespace 'com.wails.app'
    compileSdk 35

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.seuszjz.lecture"
        minSdk 21
        targetSdk 35
        versionCode appVersionCode
        versionName appVersion

        // Configure supported ABIs
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    def keystoreFile = System.getenv("ANDROID_KEYSTORE_FILE")
    def hasKeystore = keystoreFile != null && !keystoreFile.trim().isEmpty()

    signingConfigs {
        // A real keystore can be provided via environment variables; without
        // one, release builds are signed with the debug keystore so they can
        // be installed for testing (not suitable for Play Store uploads).
        release {
            if (hasKeystore) {
                storeFile file(keystoreFile)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // Source sets configuration
    sourceSets {
        main {
            // JNI libraries are in jniLibs folder
            jniLibs.srcDirs = ['src/main/jniLibs']
            // Assets for the WebView
            assets.srcDirs = ['src/main/assets']
        }
    }

    // Packaging options
    packagingOptions {
        // Don't strip Go symbols in debug builds
        doNotStrip '*/arm64-v8a/libwails.so'
        doNotStrip '*/x86_64/libwails.so'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
