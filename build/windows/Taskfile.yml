version: '3'

# Windows 桌面版构建。
#   默认产出 bin/seuszjz.exe —— 单文件、双击即用、无控制台窗口 (绿色版)。
#   安装包是可选的: wails3 task windows:package (需要 makensis: choco install nsis)
#   MSIX 需要 Windows SDK 与签名证书, 本项目不发布 MSIX, 故不提供。

includes:
  common: ../Taskfile.yml

tasks:
  build:
    desc: 构建 Windows 桌面版 (ARCH=amd64|arm64, 默认本机架构)
    deps:
      - task: build:native
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'
          OBFUSCATED: '{{.OBFUSCATED}}'
          GARBLE_ARGS: '{{.GARBLE_ARGS}}'

  build:native:
    desc: 本机 Go 交叉编译 Windows 可执行文件 (纯 Go, 不需要 CGO)
    internal: true
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
          DEV:
            ref: .DEV
      - task: common:generate:icons
    preconditions:
      - sh: '{{if eq .OBFUSCATED "true"}}command -v garble >/dev/null 2>&1{{else}}true{{end}}'
        msg: "混淆构建需要 garble: go install mvdan.cc/garble@v0.16.0"
    cmds:
      - task: generate:syso
        vars:
          ARCH: '{{.ARCH}}'
      - '{{if eq .OBFUSCATED "true"}}garble {{.GARBLE_ARGS}} build{{else}}go build{{end}} {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}.exe"'
      - cmd: powershell Remove-item *.syso
        platforms: [windows]
      - cmd: rm -f *.syso
        platforms: [linux, darwin]
    vars:
      # 发布版注入 -X main.Version=APP_VERSION, 并带 -H windowsgui 隐藏控制台。
      BUILD_FLAGS: '{{if eq .DEV "true"}}{{if or .EXTRA_TAGS (eq .OBFUSCATED "true")}}-tags {{if eq .OBFUSCATED "true"}}wails_obfuscated{{if .EXTRA_TAGS}},{{end}}{{end}}{{.EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production{{if eq .OBFUSCATED "true"}},wails_obfuscated{{end}}{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui{{if .APP_VERSION}} -X main.Version={{.APP_VERSION}}{{end}}"{{end}}'
    env:
      GOOS: windows
      CGO_ENABLED: '{{.CGO_ENABLED | default "0"}}'
      GOARCH: '{{.ARCH | default ARCH}}'

  generate:syso:
    desc: "生成 Windows 资源文件 .syso（图标 + manifest + 版本信息）"
    dir: build
    cmds:
      - wails3 generate syso -arch {{.ARCH}} -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_{{.ARCH}}.syso
    vars:
      ARCH: '{{.ARCH | default ARCH}}'

  # ---- 分发形态 ----
  # 本项目的发布形态就是绿色单文件 exe, 不做 NSIS / MSIX 安装包。
  package:
    desc: 打包绿色版 zip (内含单个 exe, 解压即用)
    cmds:
      - task: package:zip

  package:zip:
    desc: 把 exe 打成 zip
    deps:
      - task: build
    cmds:
      - cmd: >-
          powershell -NoProfile -Command "Compress-Archive -Force
          -Path '{{.BIN_DIR}}/{{.APP_NAME}}.exe'
          -DestinationPath '{{.BIN_DIR}}/{{.APP_NAME}}-windows-{{.ARCH | default ARCH}}.zip'"
        platforms: [windows]
      - cmd: zip -j "{{.BIN_DIR}}/{{.APP_NAME}}-windows-{{.ARCH | default ARCH}}.zip" "{{.BIN_DIR}}/{{.APP_NAME}}.exe"
        platforms: [linux, darwin]

  # ---- 代码签名 (需要证书; 未配置时这个任务不用跑) ----
  sign:
    desc: 给 exe 做 Authenticode 签名
    summary: |
      证书可通过 build/windows/Taskfile.yml 顶部的 SIGN_CERTIFICATE / SIGN_THUMBPRINT 指定,
      或用 `wails3 setup signing` 保存到系统钥匙串。
    deps:
      - task: build
    cmds:
      - wails3 tool sign --input "{{.BIN_DIR}}/{{.APP_NAME}}.exe" {{if .SIGN_CERTIFICATE}}--certificate "{{.SIGN_CERTIFICATE}}"{{end}} {{if .SIGN_THUMBPRINT}}--thumbprint "{{.SIGN_THUMBPRINT}}"{{end}} {{if .TIMESTAMP_SERVER}}--timestamp "{{.TIMESTAMP_SERVER}}"{{end}}

  run:
    desc: 运行已构建的桌面版
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}.exe'
