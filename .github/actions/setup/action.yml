name: 准备构建环境
description: 安装 Go、Node.js、可选的 wails3 与各平台原生依赖，供 CI / 发布流程的所有任务复用。

inputs:
  wails-version:
    description: wails3 版本号
    required: false
    default: v3.0.0-beta.34
  install-wails:
    description: 是否安装 wails3 命令行（桌面/移动平台构建需要；纯 server 二进制不需要）
    required: false
    default: 'false'
  install-gtk:
    description: Linux 上安装 GTK4 + WebKitGTK 6.0 开发包（只有 Linux 桌面版构建需要）
    required: false
    default: 'false'
  install-gtk-runtime:
    description: Linux 上只装 GTK4 + WebKitGTK 6.0 运行库（跑 wails3 命令行就需要，体积小得多）
    required: false
    default: 'false'
  install-android:
    description: 安装 Android SDK / NDK / JDK（Android 构建需要）
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: 安装 Go（版本取自 go.mod）
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: 安装 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    # 缓存的 wails3 二进制在 Linux 上动态链接了 WebKitGTK（首次可能是在装了开发包的
    # runner 上编译进缓存），所以只要调用 wails3，运行库就必须在：
    #   install-gtk          -> 开发包（编译 Linux 桌面版需要，含运行库）
    #   install-gtk-runtime  -> 只装运行库（Android/iOS 之类只用 wails3 命令行的任务）
    # 注意: composite action 的步骤不支持 timeout-minutes，这里用 `timeout` 兜住卡死的下载。
    # GH 的 Ubuntu 镜像偶尔会卡在 webkit 的大包上，所以单次给 20 分钟 + 失败重试一次。
    - name: 安装 Linux 图形库（GTK4 + WebKitGTK 6.0）
      if: (inputs.install-gtk == 'true' || inputs.install-gtk-runtime == 'true') && runner.os == 'Linux'
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 -o Dpkg::Use-Pty=0"
        if [ "${{ inputs.install-gtk }}" = "true" ]; then
          PKGS="pkg-config gcc libc6-dev libgtk-4-dev libwebkitgtk-6.0-dev"
          MODE="开发包"
        else
          PKGS="libgtk-4-1 libwebkitgtk-6.0-4"
          MODE="运行库"
        fi
        echo "安装 GTK/WebKit $MODE: $PKGS"
        sudo timeout 300 apt-get update $APT_OPTS
        for attempt in 1 2; do
          echo "第 $attempt 次安装"
          if sudo timeout 1200 apt-get install -y --no-install-recommends $APT_OPTS $PKGS; then
            break
          fi
          if [ "$attempt" = "2" ]; then
            echo "GTK/WebKit $MODE 安装两次都失败"
            exit 1
          fi
          echo "安装失败，清理 dpkg 状态并重新拉索引后重试"
          sudo dpkg --configure -a || true
          sudo timeout 300 apt-get update $APT_OPTS || true
          sleep 10
        done
        if [ "${{ inputs.install-gtk }}" = "true" ]; then
          pkg-config --exists gtk4 && pkg-config --exists webkitgtk-6.0
          echo "gtk4 $(pkg-config --modversion gtk4) / webkitgtk-6.0 $(pkg-config --modversion webkitgtk-6.0)"
        fi

    - name: 安装 JDK 21
      if: inputs.install-android == 'true'
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    - name: 安装 Android SDK / NDK
      if: inputs.install-android == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
        if [ -z "$SDK_ROOT" ]; then
          SDK_ROOT=/usr/local/lib/android/sdk
        fi
        SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
        if [ ! -x "$SDKMANAGER" ]; then
          SDKMANAGER="$(command -v sdkmanager)"
        fi
        echo "SDK: $SDK_ROOT"
        echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
        echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
        yes | timeout 120 "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
        timeout 900 "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null
        # 镜像里通常已经带了 NDK, 有就直接用, 免得为 1GB 的下载多等十几分钟。
        NDK_DIR=""
        if ls -d "$SDK_ROOT"/ndk/* > /dev/null 2>&1; then
          NDK_DIR="$(ls -d "$SDK_ROOT"/ndk/* | sort -V | tail -1)"
        else
          timeout 1200 "$SDKMANAGER" --install "ndk;27.0.12077973" > /dev/null
          NDK_DIR="$SDK_ROOT/ndk/27.0.12077973"
        fi
        echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
        echo "NDK: $NDK_DIR"
        echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
        echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
        java -version

    - name: 缓存 wails3
      if: inputs.install-wails == 'true'
      id: cache-wails
      uses: actions/cache@v4
      with:
        path: .gobin
        key: wails3-${{ inputs.wails-version }}-${{ runner.os }}-${{ runner.arch }}

    - name: 安装 wails3
      if: inputs.install-wails == 'true' && steps.cache-wails.outputs.cache-hit != 'true'
      shell: bash
      env:
        GOBIN: ${{ github.workspace }}/.gobin
      run: timeout 1500 go install github.com/wailsapp/wails/v3/cmd/wails3@${{ inputs.wails-version }}

    - name: 把 wails3 加进 PATH
      if: inputs.install-wails == 'true'
      shell: bash
      run: |
        mkdir -p "$GITHUB_WORKSPACE/.gobin"
        echo "$GITHUB_WORKSPACE/.gobin" >> "$GITHUB_PATH"
        "$GITHUB_WORKSPACE/.gobin/wails3" version

    - name: 环境信息
      shell: bash
      run: |
        go version
        node --version
        npm --version
        echo "runner: $RUNNER_OS / $RUNNER_ARCH"
