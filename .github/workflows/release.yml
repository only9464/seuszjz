name: 发布

# 触发方式:
#   1. 打 tag 推送（推荐）:  git tag v1.2.3 && git push origin v1.2.3
#      版本号取自 tag，构建完成后自动创建对应 Release 并上传全部平台产物。
#   2. Actions 页面手动运行，填版本号（同样会创建 Release），或者留空只构建产物不发布。
#
# 产物一览:
#   seuszjz-windows-{amd64,arm64}.exe             Windows 桌面版（绿色单文件）
#   seuszjz-server-windows-{amd64,arm64}.exe      Windows 服务版
#   seuszjz-macos-universal.zip / .dmg            macOS 通用二进制（arm64 + amd64）
#   seuszjz-server-darwin-{amd64,arm64}.tar.gz    macOS 服务版
#   seuszjz-linux-*.AppImage / .deb / .rpm        Linux 桌面版
#   seuszjz-server-linux-{amd64,arm64}.tar.gz     Linux 服务版
#   seuszjz-android.apk / .aab                    Android
#   seuszjz-ios-simulator.zip                     iOS（模拟器包，未签名分发）
#   ghcr.io/only9464/seuszjz                      Docker 镜像（amd64 + arm64）

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.2.3）。留空则只构建产物、不创建 Release；tag 推送时忽略此项。'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  WAILS_VERSION: v3.0.0-beta.34

jobs:
  # 解析版本号与 tag，供后续所有任务使用
  prepare:
    name: 解析版本
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      sha: ${{ steps.v.outputs.sha }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - name: 计算版本号
        id: v
        shell: bash
        run: |
          set -euo pipefail
          input="${{ github.event.inputs.version }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            publish=true
          elif [[ -n "$input" ]]; then
            version="${input#v}"
            publish=true
          else
            version="0.0.0-dev-${GITHUB_SHA::7}"
            publish=false
          fi
          echo "version=$version"             >> "$GITHUB_OUTPUT"
          echo "tag=v$version"                >> "$GITHUB_OUTPUT"
          echo "sha=$GITHUB_SHA"              >> "$GITHUB_OUTPUT"
          echo "publish=$publish"             >> "$GITHUB_OUTPUT"
          echo "本次版本: v$version (发布: $publish)"

  # 发布前的门槛：前端能编译 + Go 能通过静态检查与单元测试
  check:
    name: 检查
    needs: prepare
    runs-on: ubuntu-latest
    env:
      # 关闭 cgo: 服务版不需要 CGO, 也就不用装 GTK/WebKit 开发包
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: 构建前端
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: 静态检查与单元测试
        run: |
          go vet -tags server ./...
          go test -tags server ./...

  # Windows：桌面版 + 服务版，两个架构
  windows:
    name: Windows (${{ matrix.arch }})
    needs: [prepare, check]
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          wails-version: ${{ env.WAILS_VERSION }}
          install-wails: 'true'

      - name: 写入版本号
        shell: bash
        run: python .github/scripts/set-version.py "${{ needs.prepare.outputs.version }}"

      - name: 构建桌面版
        shell: bash
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: wails3 task windows:build ARCH=${{ matrix.arch }}

      - name: 构建服务版
        shell: bash
        env:
          GOOS: windows
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          go build -tags server,production -trimpath -buildvcs=false \
            -ldflags="-s -w -X main.Version=${APP_VERSION}" -o bin/seuszjz-server.exe .

      - name: 收集产物
        shell: bash
        run: |
          mkdir -p out
          cp bin/seuszjz.exe "out/seuszjz-windows-${{ matrix.arch }}.exe"
          cp bin/seuszjz-server.exe "out/seuszjz-server-windows-${{ matrix.arch }}.exe"
          # 额外留一份 seuszjz.exe 别名，README 顶部的下载徽章直接指向这个文件名
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            cp bin/seuszjz.exe out/seuszjz.exe
          fi
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  # Windows 安装包（可选，需要 NSIS）
  macos:
    name: macOS
    needs: [prepare, check]
    runs-on: macos-14
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          wails-version: ${{ env.WAILS_VERSION }}
          install-wails: 'true'

      - name: 写入版本号
        run: python3 .github/scripts/set-version.py "${{ needs.prepare.outputs.version }}"

      - name: 构建通用二进制 .app
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: wails3 task darwin:package:universal

      - name: 生成 dmg 与 zip
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          wails3 task darwin:create:dmg
          ditto -c -k --sequesterRsrc --keepParent "bin/seuszjz.app" "bin/seuszjz-macos-universal.zip"
          ls -l bin

      - name: 编译服务版（darwin amd64/arm64）
        env:
          CGO_ENABLED: '0'
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          for arch in amd64 arm64; do
            name="seuszjz-server-darwin-${arch}"
            GOOS=darwin GOARCH=$arch go build -tags server,production -trimpath -buildvcs=false \
              -ldflags="-s -w -X main.Version=${APP_VERSION}" -o "bin/${name}" .
            tar -czf "bin/${name}.tar.gz" -C bin "${name}"
            rm "bin/${name}"
          done

      - name: 收集产物
        run: |
          mkdir -p out
          cp bin/seuszjz-macos-universal.zip out/
          cp bin/seuszjz.dmg "out/seuszjz-macos-universal.dmg"
          cp bin/seuszjz-server-darwin-*.tar.gz out/
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*
          if-no-files-found: error

  # Linux 桌面版：deb / rpm 必需，AppImage 可能因 linuxdeploy 环境失败，不阻断发布
  linux-desktop:
    name: Linux 桌面版
    needs: [prepare, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # GTK/WebKit 开发包偶尔会因为镜像站抽风装不上；Linux 桌面版不是主发布形态，
    # 所以这里不阻断 Release（ci.yml 里同样是必须通过的，出问题能在 PR 上看到）。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          wails-version: ${{ env.WAILS_VERSION }}
          install-wails: 'true'
          install-gtk: 'true'

      - name: 写入版本号
        run: python3 .github/scripts/set-version.py "${{ needs.prepare.outputs.version }}"

      - name: 构建
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: wails3 task linux:build

      - name: 打 deb / rpm
        run: |
          wails3 task linux:generate:dotdesktop
          wails3 task linux:generate:deb
          wails3 task linux:generate:rpm
          ls -l bin

      - name: 打 AppImage
        id: appimage
        continue-on-error: true
        run: |
          wails3 task linux:create:appimage
          ls -l bin

      - name: 收集产物
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out
          cp bin/seuszjz "out/seuszjz-linux-amd64"
          tar -czf "out/seuszjz-linux-amd64.tar.gz" -C out seuszjz-linux-amd64
          rm "out/seuszjz-linux-amd64"
          cp bin/seuszjz.deb "out/seuszjz_${VERSION}_amd64.deb"
          cp bin/seuszjz.rpm "out/seuszjz-${VERSION}-1.x86_64.rpm"
          for f in bin/*.AppImage; do
            [ -e "$f" ] || continue
            cp "$f" "out/seuszjz-linux-amd64.AppImage"
          done
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: linux-desktop
          path: out/*
          if-no-files-found: warn

  # Linux 服务版：纯 Go 交叉编译（不需要 GTK）
  linux-server:
    name: Linux 服务版（${{ matrix.arch }}）
    needs: [prepare, check]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: 写入版本号
        run: python3 .github/scripts/set-version.py "${{ needs.prepare.outputs.version }}"

      - name: 构建前端
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: 交叉编译
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          name="seuszjz-server-linux-${{ matrix.arch }}"
          go build -tags server,production -trimpath -buildvcs=false \
            -ldflags="-s -w -X main.Version=${APP_VERSION}" -o "out/${name}" .
          tar -czf "out/${name}.tar.gz" -C out "${name}"
          rm "out/${name}"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: linux-server-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  # Android：APK + AAB
  android:
    name: Android
    needs: [prepare, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      # 配置了 keystore secret 就用正式签名，否则退回 debug 签名（可安装，不能上架）
      ANDROID_KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_FILE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          wails-version: ${{ env.WAILS_VERSION }}
          install-wails: 'true'
          install-gtk-runtime: 'true'
          install-android: 'true'

      - name: 写入版本号
        run: python3 .github/scripts/set-version.py "${{ needs.prepare.outputs.version }}"

      - name: 构建 APK（arm64 + x86_64 通用包）
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: wails3 task android:package:fat

      - name: 构建 AAB
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: wails3 task android:bundle

      - name: 收集产物
        run: |
          mkdir -p out
          cp bin/seuszjz.apk out/seuszjz-android.apk
          cp bin/seuszjz.aab out/seuszjz-android.aab
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*
          if-no-files-found: error

  # iOS：模拟器包（ad-hoc 签名，可直接跑模拟器；真机分发需要自己的证书）
  ios:
    name: iOS（模拟器）
    needs: [prepare, check]
    runs-on: macos-14
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          wails-version: ${{ env.WAILS_VERSION }}
          install-wails: 'true'

      - name: 写入版本号
        run: python3 .github/scripts/set-version.py "${{ needs.prepare.outputs.version }}"

      - name: 构建 .app
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: wails3 task ios:package

      - name: 收集产物
        run: |
          mkdir -p out
          ditto -c -k --sequesterRsrc --keepParent "bin/seuszjz.app" "out/seuszjz-ios-simulator.zip"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: out/*
          if-no-files-found: error

  # Docker 镜像：多架构推送到 GHCR
  docker:
    name: Docker 镜像
    needs: [prepare, check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      # 镜像构建时要把前端产物拷进去（go:embed all:frontend/dist）
      - name: 构建前端
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: 启用 QEMU（构建 arm64 镜像用）
        uses: docker/setup-qemu-action@v3

      - name: 启用 buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=sha,format=short
            type=raw,value=latest,enable=${{ !startsWith(needs.prepare.outputs.version, '0.0.0-dev') }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/docker/Dockerfile.server
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # GitHub Release：汇总全部平台产物 + 校验和 + 发布说明
  release:
    name: 创建 Release
    needs: [prepare, check, windows, macos, linux-desktop, linux-server, android, ios]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 只按名字挑自己的产物: docker 任务的 buildx 缓存也会挂在这次 run 的 artifacts 里,
      # 用不带过滤的下载会因为那个不是 zip 而报 "Artifact download failed after 5 retries"。
      - name: 下载产物（Windows）
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: 'windows-*'
          merge-multiple: true

      - name: 下载产物（Linux）
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: 'linux-*'
          merge-multiple: true

      - name: 下载产物（macOS）
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: 'macos'
          merge-multiple: true

      - name: 下载产物（Android）
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: 'android'
          merge-multiple: true

      - name: 下载产物（iOS）
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: 'ios'
          merge-multiple: true

      - name: 生成校验和
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          ls -l

      - name: 生成发布说明
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          prev="$(git describe --tags --abbrev=0 'HEAD^' 2>/dev/null || true)"
          if [[ -n "$prev" ]]; then range="$prev..HEAD"; else range="HEAD"; fi
          {
            echo "# v${VERSION}"
            echo
            echo "## 下载"
            echo
            echo "| 文件 | 说明 |"
            echo "| --- | --- |"
            echo "| \`seuszjz-windows-amd64.exe\` | Windows 桌面版（x64，双击即用，无控制台窗口） |"
            echo "| \`seuszjz-windows-arm64.exe\` | Windows 桌面版（ARM64） |"
            echo "| \`seuszjz-server-windows-amd64.exe\` | Windows 服务版（x64） |"
            echo "| \`seuszjz-server-windows-arm64.exe\` | Windows 服务版（ARM64） |"
            echo "| \`seuszjz-macos-universal.zip\` | macOS 通用二进制 .app（Apple Silicon + Intel） |"
            echo "| \`seuszjz-macos-universal.dmg\` | macOS 安装镜像 |"
            echo "| \`seuszjz-server-darwin-amd64.tar.gz\` | macOS 服务版（Intel） |"
            echo "| \`seuszjz-server-darwin-arm64.tar.gz\` | macOS 服务版（Apple Silicon） |"
            echo "| \`seuszjz-linux-amd64.tar.gz\` | Linux 桌面版（压缩包，需要 GTK4 + WebKitGTK 6.0） |"
            echo "| \`seuszjz_*.deb\` / \`*.rpm\` | Linux 桌面版系统包 |"
            echo "| \`seuszjz-linux-amd64.AppImage\` | Linux AppImage（若构建成功） |"
            echo "| \`seuszjz-server-linux-amd64.tar.gz\` | Linux 服务版（x86_64） |"
            echo "| \`seuszjz-server-linux-arm64.tar.gz\` | Linux 服务版（ARM64） |"
            echo "| \`seuszjz-android.apk\` | Android 应用（arm64 + x86_64） |"
            echo "| \`seuszjz-android.aab\` | Android App Bundle（上架用） |"
            echo "| \`seuszjz-ios-simulator.zip\` | iOS 模拟器包（未签名，真机需自行签名） |"
            echo "| \`SHA256SUMS.txt\` | 以上文件的 SHA-256 校验和 |"
            echo
            echo "## Docker"
            echo
            echo '```bash'
            echo "docker run -d --name seuszjz -p 8080:8080 ghcr.nju.edu.cn/only9464/seuszjz:${VERSION}"
            echo '```'
            echo
            echo "## 变更"
            echo
            git log --no-merges --pretty=format:'- %s' "$range"
            echo
          } > NOTES.md
          cat NOTES.md

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          args=(release create "$TAG" dist/* --title "v${VERSION}" --notes-file NOTES.md)
          if [[ "$EVENT" != "push" ]]; then
            args+=(--target "$SHA")
          fi
          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
